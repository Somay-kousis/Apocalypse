# ============================================================================
# CANONICAL CONTROL SPEC - single source of truth for all 9 boundaries.
# Every checker in controls/<owner>/ reads this. Agree here before writing code.
#
# Methodology (see METHODOLOGY.md): reconstruct -> define standard -> testable
# control -> HEADLINE NUMBER FIRST -> build env -> validate -> measure -> report.
#
# Per-control schema (all five report columns are mandatory):
#   id, name, owner, boundary
#   requirement    : the containment standard (one sentence)
#   pass_condition : the exact testable condition that flips PASS/FAIL
#   verification   : how a 3rd party checks it WITHOUT lab network access
#   detection_sla  : if the control is bypassed, how fast detection must fire  [DRAFT-owner confirms]
#   adoption_cost  : rough effort for a real org to adopt                       [DRAFT-owner confirms]
#   check_module   : dotted path -> callable(target_dir[, context]) -> controls.base.CheckResult
#   sok_class      : class from arXiv:2607.25379 (paper 1)
#   tested_vs_spec : "tested" (broken/fixed target exercises it) | "spec-only"
#   depends_on     : boundaries this one composes (rule 9 only). run_checks.py
#                    runs these first and passes their CheckResults in `context`.
#
# artifact_type / boundary_dir / config_file(s) - ADDED: pin down what a
# checker actually reads, so "copy check_hdf5.py's pattern" stops meaning
# "grep every artifact as if it were plain text". Three types in use:
#   text  : plain config text, safe to .lower()/keyword-match (rules 4, 5, 8)
#   yaml  : structured manifest - parse with yaml.safe_load, assert on fields,
#           never string-match (rules 1, 2, 3, 6, 7)
#   graph : cross-boundary reachability/composition data (rule 9 only) - reads
#           its own boundary dir AND the `context` results from depends_on
#
# Every boundary_dir lives under <target_dir>/<boundary_dir>/, e.g.
# environments/broken_lab/configs/b2_egress/egress_policy.yaml
# ============================================================================

controls:
  - id: 1
    name: Package registry seal
    owner: Junyi
    boundary: "Zero-day in shared package registry"
    requirement: "Sealed, read-only mirrors with no shared-infra access."
    pass_condition: "Mirror manifest is hash-attested and eval namespace has no route to shared registry infra."
    verification: "Hash-attested mirror manifest audit."
    detection_sla: "Mirror-hash mismatch alerts at pull time (<1 min)."   # DRAFT
    adoption_cost: "Medium - requires per-eval sealed mirror infra."       # DRAFT
    check_module: controls.junyi.check_registry:run
    sok_class: "supply-chain & credential exposure"
    tested_vs_spec: tested
    artifact_type: yaml
    boundary_dir: b1_registry
    config_file: mirror_manifest.yaml

  - id: 2
    name: Egress default-deny
    owner: Vikas
    boundary: "Internet access"
    requirement: "Outbound blocked by default, short allowlist."
    pass_condition: "Egress policy is deny-all by default; allowlist entries have matching domain+SNI (no fronting), no wildcards or IP literals, no bare single-label domains; allowlist non-empty."
    verification: "Egress policy audit: default-deny + per-entry domain/SNI-agreement, wildcard, and IP-literal checks (controls/vikas/check_egress.py)."
    detection_sla: "Repeated denied egress alerts (<5 min)."              # DRAFT
    adoption_cost: "Low-medium - NetworkPolicy / firewall rules."          # DRAFT
    check_module: controls.vikas.check_egress:run
    sok_class: "persistent command-and-control"
    tested_vs_spec: tested
    artifact_type: yaml
    boundary_dir: b2_egress
    config_file: egress_policy.yaml

  - id: 3
    name: Rootless code execution
    owner: Junyi
    boundary: "Arbitrary C code execution as root"
    requirement: "Non-root, no added capabilities, no egress."
    pass_condition: "runAsNonRoot true; no added caps (no CAP_NET_RAW/SYS_ADMIN); egress off; seccomp profile set."
    verification: "Container security-context audit."
    detection_sla: "Privileged-syscall / seccomp violation alert (<1 min)." # DRAFT
    adoption_cost: "Low - security-context fields."                          # DRAFT
    check_module: controls.junyi.check_sandbox:run
    sok_class: "objectives conflicting with sandbox boundaries"
    tested_vs_spec: tested
    artifact_type: yaml
    boundary_dir: b3_sandbox
    config_file: security_context.yaml

  - id: 4
    name: Loader blocks external refs
    owner: Somay
    boundary: "HDF5 external-storage access"
    requirement: "Loader blocks external references."
    pass_condition: "Loader refuses HDF5 external raw storage / external links; driver-restricted opens only."
    verification: "Signed config-schema test suite (SHARED with #5)."
    detection_sla: "External-ref load attempt logged + alert (<1 min)."   # DRAFT
    adoption_cost: "Low - loader policy + schema."                         # DRAFT
    check_module: controls.somay.check_hdf5:run
    sok_class: "multi-step offensive chains"
    tested_vs_spec: tested
    artifact_type: text
    boundary_dir: b4_hdf5
    config_file: loader_policy.txt

  - id: 5
    name: No template eval on untrusted config
    owner: Somay
    boundary: "Jinja2 template injection"
    requirement: "Untrusted configs are never templated."
    pass_condition: "No template engine renders untrusted config; if unavoidable, SandboxedEnvironment with no builtins."
    verification: "Same signed config-schema test suite as #4."
    detection_sla: "Template-on-config attempt fails at build/pre-deploy (not runtime)." # DRAFT
    adoption_cost: "Low - parse config as data (yaml.safe_load)."          # DRAFT
    check_module: controls.somay.check_jinja:run
    sok_class: "multi-step offensive chains"
    tested_vs_spec: tested
    artifact_type: text
    boundary_dir: b5_jinja
    config_file: config_pipeline.txt

  - id: 6
    name: IMDS + SA-token lockdown
    owner: Vikas
    boundary: "Cloud metadata access"
    requirement: "IMDS blocked, SA token automount off."
    pass_condition: "Link-local (169.254.169.254/32) denied outright, OR IMDSv2-only (HttpTokens required) with hop-limit 1 (hop-limit alone is not sufficient); automountServiceAccountToken strictly boolean false."
    verification: "Pod-spec audit: link-local/hop-limit/http-tokens combination + type-strict automount check (controls/vikas/check_imds.py)."
    detection_sla: "Link-local egress / token-read attempt alert (<1 min)." # DRAFT
    adoption_cost: "Low - pod-spec + NetworkPolicy."                         # DRAFT
    check_module: controls.vikas.check_imds:run
    sok_class: "supply-chain & credential exposure"
    tested_vs_spec: tested
    artifact_type: yaml
    boundary_dir: b6_imds
    config_file: pod_spec.yaml

  - id: 7
    name: Control-plane unreachable from workers
    owner: Vikas
    boundary: "Cluster API access"
    requirement: "Workers denied control-plane access."
    pass_condition: "No path from a data-plane worker to kubernetes.default.svc API where BOTH NetworkPolicy (network_reachable) AND RBAC (rbac_permitted) permit it at every hop; single-layer-open edges are flagged as a hardening note."
    verification: "RBAC/NetworkPolicy two-layer graph reachability check (controls/vikas/check_controlplane.py)."
    detection_sla: "API-server access from data-plane alert (<1 min)."    # DRAFT
    adoption_cost: "Medium - NetworkPolicy + RBAC review."                 # DRAFT
    check_module: controls.vikas.check_controlplane:run
    sok_class: "multi-step offensive chains"
    tested_vs_spec: tested
    artifact_type: yaml
    boundary_dir: b7_controlplane
    config_file: rbac_graph.yaml

  - id: 8
    name: No reusable VPN keys + startup detection
    owner: Junyi
    boundary: "Unauthorized Tailscale startup"
    requirement: "No reusable keys in worker env; startup detected."
    pass_condition: "No reusable auth keys in worker env; VPN-client startup + decoder-obfuscated payloads detected."
    verification: "Secret-scanning + alert-log schema check. (Decoder-aware matcher: unpack base64/gzip, then match sequence.)"
    detection_sla: "VPN-binary startup / authkey use alert (<1 min)."     # DRAFT
    adoption_cost: "Low-medium - secret scan + detection rule."           # DRAFT
    check_module: controls.junyi.check_tailscale:run
    sok_class: "persistent command-and-control"
    tested_vs_spec: tested
    artifact_type: text
    boundary_dir: b8_tailscale
    config_file: worker_env.txt
    detection_log: alert_log.jsonl

  - id: 9
    name: Origin-scoped credentials + blast-radius bound
    owner: Somay
    boundary: "Stolen credentials"
    requirement: "Credentials scoped to origin/purpose; no identity's COMBINED reach across #6-8 exceeds a declared blast-radius bound."
    pass_condition: "Stolen token is useless off-origin; AND min-cut reachability over RBAC/IAM/connector configs shows no identity exceeds the declared bound."
    verification: "Credential-scope audit (replay exfil vs Biscuit-attenuated tokens) + min-cut reachability over RBAC/IAM/connector configs (networkx)."
    detection_sla: "Off-origin token use rejected + alert (<1 min); blast-radius recomputed on every IAM change." # DRAFT
    adoption_cost: "High - workload identity + IAM graph modeling."        # DRAFT
    check_module: controls.somay.check_creds:run
    sok_class: "supply-chain & credential exposure"
    tested_vs_spec: tested
    depends_on: [6, 7, 8]   # cross-boundary: composes these to compute combined reach
    artifact_type: graph
    boundary_dir: b9_credentials
    config_file: credential_scope.yaml
    graph_file: iam_graph.json
